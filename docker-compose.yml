services:
  auth-service:
    build:
      context: ./src
      dockerfile: AuthService/Dockerfile
    container_name: hrm_auth_service
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_INTERNAL_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      ConnectionStrings__AuthDb: >
        Host=${POSTGRES_HOST};
        Port=${POSTGRES_PORT};
        Database=${AUTH_POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}
  employee-service:
    build:
      context: ./src
      dockerfile: EmployeeService/Dockerfile
    container_name: hrm_employee_service
    ports:
      - "${EMPLOYEE_SERVICE_PORT}:${EMPLOYEE_SERVICE_INTERNAL_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      ConnectionStrings__EmployeeDb: >
        Host=${POSTGRES_HOST};
        Port=${POSTGRES_PORT};
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}

  apigateway:
    build:
      context: ./src
      dockerfile: ApiGateway/Dockerfile
    container_name: hrm_api_gateway
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_INTERNAL_PORT}"
    depends_on:
      - employee-service
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
    networks:
      - ${DOCKER_NETWORK}

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ${DOCKER_NETWORK}

networks:
  hrm-network:
    external: true
